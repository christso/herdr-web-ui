<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Herdr launch profile proposal</title><style>
:root{color-scheme:dark;--bg:#12100e;--panel:#181613;--elevated:#211e1a;--input:#1c1916;--border:#3e3830;--text:#d8d0c3;--dim:#9b9183;--strong:#f2ebdf;--accent:#f0a830}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.proposal{background:var(--panel);padding:15px 24px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center}.proposal b{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.proposal span{color:var(--dim);font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:850px}.sidebar{padding:25px 20px;background:var(--panel);color:var(--dim);border-right:1px solid #2d2924}.brand{color:var(--strong);font-weight:600;margin-bottom:28px}.workspace{padding:11px 12px;border-radius:9px;background:#2a2621;color:var(--text)}.workspace small{display:block;color:var(--dim);padding-left:22px}.stage{position:relative;display:flex;align-items:flex-start;justify-content:center;padding:45px 25px;background:linear-gradient(#12100eaa,#080604aa)}.modal{width:480px;max-width:100%;border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:0 16px 48px #0009;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #2d2924}h1{font-size:19px;margin:0;font-weight:600;color:var(--strong)}.close{border:0;background:none;color:var(--dim);font-size:24px;line-height:1;padding:0 0 0 12px}.fields{padding:20px 24px;display:grid;gap:20px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:600;color:var(--strong)}input,select,.folder{width:100%;font:inherit;color:var(--text);background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px 12px;min-width:0}select{padding-right:26px}.hint,.lead{font-size:12px;color:var(--dim);margin:0}.lead{font-size:13px}.folder{color:var(--dim);background:transparent;overflow-wrap:anywhere}.footer{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #2d2924;padding:16px 24px}button{cursor:pointer}.btn{border:1px solid var(--border);border-radius:8px;background:var(--elevated);color:var(--text);padding:9px 15px;font:inherit;font-weight:500}.primary{background:var(--accent);color:#1b1407;border-color:var(--accent);font-weight:600}.note{width:480px;max-width:100%;font-size:13px;color:var(--dim);margin-top:18px}.content{max-width:100%}.field:focus-within select,.field:focus-within input{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:650px){.proposal{padding:12px 16px;display:block}.proposal span{display:block;margin-top:3px}.app{display:block;min-height:0}.sidebar{display:none}.stage{padding:22px 12px;min-height:calc(100vh - 80px)}header{padding:18px}.fields{padding:18px;gap:18px}.footer{padding:14px 18px}h1{font-size:17px}.note{padding:0 6px}}
</style><div class="proposal"><b>Design mockup</b><span>Choose an agent, then one of its profiles on this PC.</span></div><div class="app"><aside class="sidebar"><div class="brand">▣ &nbsp; Herdr</div><p>Workstation <span style="color:#93c36b">●</span></p><div class="workspace">▱ &nbsp; Example project<small>~/projects/example</small></div></aside><main class="stage"><div class="content"><form class="modal" onsubmit="event.preventDefault()"><header><h1 id="title">New tab · Example project</h1><button class="close" aria-label="Close">×</button></header><div class="fields" id="fields"></div><div class="footer"><button class="btn" type="button">Cancel</button><button class="btn primary" id="create">Create tab</button></div></form><p class="note">Profiles are configured on the PC running the agent. Default keeps the ordinary launch behavior.</p></div></main></div><script>
const worktree=new URLSearchParams(location.search).get('mode')==='worktree';
const agent=worktree?'omp':'codex';
const field=(label,body,hint='')=>`<div class="field"><label>${label}</label>${body}${hint?`<p class="hint">${hint}</p>`:''}</div>`;
const agents=field('Agent',`<select aria-label="Agent"><option value="codex" ${agent==='codex'?'selected':''}>Codex</option><option value="omp" ${agent==='omp'?'selected':''}>OMP</option><option value="pi">Pi</option><option value="">Shell</option></select>`);
const profile=field('Profile','<select aria-label="Profile"><option>Default</option><option selected>Compound engineering</option></select>');
if(worktree){document.getElementById('title').textContent='New worktree · Example project';document.getElementById('create').textContent='Create worktree';document.getElementById('fields').innerHTML='<p class="lead">A git worktree of this repository, opened as a workspace next to this one.</p>'+field('Branch','<input aria-label="Branch" value="feat/session-profiles">')+field('Start from','<input aria-label="Start from" placeholder="HEAD">')+field('Name','<input aria-label="Name" value="Session profiles">')+agents+profile;}else{document.getElementById('fields').innerHTML=agents+profile+field('Directory','<div class="folder">▱ &nbsp; ~/projects/example</div>',"Uses the workspace’s folder")+field('Name','<input aria-label="Name" placeholder="Optional">');}
document.querySelector('[aria-label=Agent]').addEventListener('change',e=>{document.querySelector('[aria-label=Profile]').closest('.field').hidden=!e.target.value;});
</script></html>
